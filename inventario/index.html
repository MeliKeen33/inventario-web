<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario D&amp;L — Acermel</title>
<style>
  :root{
    --papel:#F6F5F3;
    --tinta:#171614;
    --gris:#6E6A64;
    --linea:#D9D5CE;
    --campo:#FFFFFF;
    --alarma:#A5281F;
    --accion:#1F5F56;
    color-scheme: light;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *,*::before,*::after{box-sizing:inherit}

  body{
    margin:0;
    background:var(--papel);
    color:var(--tinta);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-variant-numeric: tabular-nums;
  }
  main{max-width:46rem;margin:0 auto;padding:1.5rem 1rem 4rem}

  h1{font-size:1.15rem;font-weight:600;margin:0 0 .15rem}
  .sub{color:var(--gris);font-size:.85rem;margin:0 0 1.5rem}

  nav{display:flex;gap:.4rem;margin-bottom:1.25rem}
  nav button{
    flex:1;padding:.7rem .5rem;border:1px solid var(--linea);
    background:var(--campo);color:var(--gris);border-radius:3px;
    font:inherit;font-size:.9rem;cursor:pointer;
  }
  nav button[aria-selected="true"]{
    background:var(--tinta);color:var(--papel);border-color:var(--tinta);font-weight:500;
  }
  nav button:focus-visible,input:focus-visible,select:focus-visible,
  .enviar:focus-visible{outline:2px solid var(--accion);outline-offset:2px}

  section[hidden]{display:none}

  label{display:block;font-size:.8rem;color:var(--gris);margin:1rem 0 .3rem}
  input,select{
    width:100%;padding:.75rem;font:inherit;background:var(--campo);
    color:var(--tinta);border:1px solid var(--linea);border-radius:3px;
  }
  .enviar{
    width:100%;margin-top:1.5rem;padding:.9rem;background:var(--accion);
    color:#fff;border:0;border-radius:3px;font:inherit;font-weight:500;cursor:pointer;
  }
  .enviar:disabled{opacity:.5;cursor:wait}

  /* Lista de stock */
  .fila{
    display:flex;align-items:baseline;gap:.75rem;
    padding:.8rem 0;border-bottom:1px solid var(--linea);
  }
  .fila .texto{flex:1;min-width:0}
  .fila .codigo{font-weight:600;font-size:.9rem}
  .fila .desc{color:var(--gris);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fila .cant{font-size:1.5rem;font-weight:600;letter-spacing:-.02em}
  .fila .cant.negativo{color:var(--alarma)}
  .fila .donde{color:var(--gris);font-size:.75rem;min-width:2rem;text-align:right}

  .aviso{padding:.8rem;border-radius:3px;margin-top:1rem;font-size:.9rem;white-space:pre-wrap}
  .aviso.ok{background:#E6EFEC;color:var(--accion)}
  .aviso.mal{background:#F6E7E6;color:var(--alarma)}
  .vacio{color:var(--gris);padding:2rem 0;text-align:center;font-size:.9rem}
  .sentido{font-size:.8rem;margin:.35rem 0 0;font-weight:600}
  .sentido.entra{color:var(--accion)}
  .sentido.sale{color:var(--alarma)}
  .ayuda{color:var(--gris);font-size:.75rem;margin:.3rem 0 0}
  .sesion{display:flex;align-items:center;gap:.75rem;margin:0 0 1.25rem;
    padding:.6rem .75rem;background:var(--campo);border:1px solid var(--linea);border-radius:3px}
  .sesion .quien{flex:1;min-width:0;font-size:.9rem}
  .sesion .quien strong{font-weight:600}
  .sesion .rol{color:var(--gris);font-size:.8rem}
  .salir{padding:.55rem .8rem;border:1px solid var(--linea);background:var(--papel);
    color:var(--tinta);border-radius:3px;font:inherit;font-size:.85rem;cursor:pointer}
  .salir:focus-visible{outline:2px solid var(--accion);outline-offset:2px}
  [hidden]{display:none !important}
  .resumen{color:var(--gris);font-size:.85rem;margin:.9rem 0 .2rem}
  .resumen strong{color:var(--tinta);font-weight:600}
</style>
</head>
<body>
<main>

  <h1>Inventario D&amp;L</h1>
  <p class="sub">Centro de distribución y logística — Acermel</p>

  <!-- ====== LOGIN ====== -->
  <section id="p-login" hidden>
    <form id="l-form">
      <label for="l-mail">Mail</label>
      <input id="l-mail" type="email" autocomplete="username" required>

      <label for="l-clave">Contraseña</label>
      <input id="l-clave" type="password" autocomplete="current-password" required>

      <button class="enviar" id="l-entrar" type="submit">Entrar</button>
    </form>
    <div id="l-aviso"></div>
  </section>

  <!-- ====== APP (solo con sesión) ====== -->
  <div id="app" hidden>

  <div class="sesion">
    <div class="quien">
      <strong id="s-nombre"></strong>
      <div class="rol" id="s-rol"></div>
    </div>
    <button class="salir" id="s-salir">Cerrar sesión</button>
  </div>

  <nav id="pestanas">
    <button id="t-stock" aria-selected="true">Stock</button>
    <button id="t-mov"   aria-selected="false">Movimiento</button>
    <button id="t-prod"  aria-selected="false">Producto nuevo</button>
  </nav>

  <!-- ====== STOCK ====== -->
  <section id="p-stock">
    <input id="buscar" placeholder="Buscar por código o descripción" autocomplete="off">
    <p id="resumen" class="resumen" aria-live="polite"></p>
    <div id="lista"><p class="vacio">Cargando…</p></div>
  </section>

  <!-- ====== MOVIMIENTO ====== -->
  <section id="p-mov" hidden>
    <label for="m-prod">Producto</label>
    <select id="m-prod"></select>

    <label for="m-fecha">Fecha del movimiento</label>
    <input id="m-fecha" type="date">

    <label for="m-motivo">Motivo</label>
    <select id="m-motivo"><option value="">Cargando…</option></select>
    <p id="m-sentido" class="sentido"></p>

    <label for="m-cant">Cantidad</label>
    <input id="m-cant" type="number" inputmode="numeric" min="1" step="1" placeholder="Ej.: 50">

    <label for="m-nota">Nota (opcional)</label>
    <input id="m-nota" autocomplete="off">

    <button class="enviar" id="m-guardar">Registrar movimiento</button>
    <div id="m-aviso"></div>
  </section>

  <!-- ====== PRODUCTO ====== -->
  <section id="p-prod" hidden>
    <label for="p-codigo">Código</label>
    <input id="p-codigo" autocomplete="off" placeholder="Ej.: D430-15806">

    <label for="p-desc">Descripción</label>
    <input id="p-desc" autocomplete="off">

    <label for="p-tipo">Tipo</label>
    <select id="p-tipo">
      <option value="COR">COR — corte</option>
      <option value="SE">SE — semielaborado</option>
      <option value="ACC">ACC — accesorio</option>
      <option value="MP">MP — materia prima</option>
    </select>

    <div id="p-etapa-caja" hidden>
      <label for="p-etapa">Etapa</label>
      <input id="p-etapa" autocomplete="off" placeholder="En qué parte del proceso está">
    </div>

    <label for="p-origen">Origen</label>
    <select id="p-origen">
      <option value="fabricado">Fabricado</option>
      <option value="comprado">Comprado</option>
      <option value="importado">Importado</option>
    </select>

    <label for="p-pos">Posición</label>
    <input id="p-pos" autocomplete="off" placeholder="Ej.: D3">

    <div id="p-familia-caja" hidden>
      <label for="p-familia">Familia: códigos que cubre la X</label>
      <input id="p-familia" autocomplete="off" placeholder="Ej.: CUE-61311, CUE-61321">
      <p class="ayuda">Separados por coma o espacio.</p>
    </div>

    <button class="enviar" id="p-guardar">Dar de alta</button>
    <div id="p-aviso"></div>
  </section>

  </div><!-- /app -->

</main>

<script type="module">
// ============================================================
//  PEGÁ ACÁ LOS DOS DATOS DE TU PROYECTO SUPABASE.
//  Están en Project Settings → API.
//  La anon key es pública a propósito: lo que protege de verdad
//  son las policies que creaste en el SQL, no esta clave.
// ============================================================
const SUPABASE_URL  = 'https://vlygzhldkykilsuzcbfi.supabase.co';
const SUPABASE_ANON = 'sb_publishable_FObCZuZpqp2WZInBSO24hw_T6kh5kez';

import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';
const db = createClient(SUPABASE_URL, SUPABASE_ANON);

const $ = id => document.getElementById(id);
let filas = [];

// ---------- pestañas según rol ----------
// Esto solo arma la pantalla: lo que cada rol puede hacer lo bloquea la base con RLS.
const tabs = [['t-stock','p-stock'],['t-mov','p-mov'],['t-prod','p-prod']];
const PERMISOS = {
  planta:   ['t-stock', 't-mov'],
  admin:    ['t-stock', 't-mov', 't-prod'],
  gerencia: ['t-stock'],
};
const NOMBRE_ROL = { planta: 'Planta', admin: 'Administración', gerencia: 'Gerencia' };
let permitidas = [];

function abrir(bot){
  if (!permitidas.includes(bot)) return;
  tabs.forEach(([b, p]) => {
    $(b).setAttribute('aria-selected', b === bot);
    $(p).hidden = b !== bot;
  });
  if (bot === 't-stock') cargarStock();
}
tabs.forEach(([bot]) => $(bot).onclick = () => abrir(bot));

function armarPantalla(rol){
  permitidas = PERMISOS[rol] ?? [];
  tabs.forEach(([b, p]) => {
    $(b).hidden = !permitidas.includes(b);
    $(p).hidden = true;
  });
  // Con una sola pestaña, la barra no aporta nada.
  $('pestanas').hidden = permitidas.length < 2;
  if (permitidas.length) abrir(permitidas[0]);
}

// ---------- stock ----------
async function cargarStock(){
  const { data, error } = await db.from('stock').select('*').order('codigo');
  if (error) { $('lista').innerHTML = `<p class="vacio">${error.message}</p>`; return; }
  filas = data;
  pintar();
  $('m-prod').innerHTML = data
    .map(f => `<option value="${f.codigo}">${f.codigo} — ${f.descripcion}</option>`)
    .join('');
}

function pintar(){
  const q = $('buscar').value.trim().toLowerCase();
  const ver = q
    ? filas.filter(f => (f.codigo + ' ' + f.descripcion).toLowerCase().includes(q))
    : filas;

  const unidades = ver.reduce((t, f) => t + (Number(f.stock) || 0), 0);
  const fmt = n => n.toLocaleString('es-AR');
  $('resumen').innerHTML =
    `<strong>${fmt(ver.length)}</strong> ${ver.length === 1 ? 'producto' : 'productos'}` +
    (q ? ` de ${fmt(filas.length)}` : '') +
    ` · <strong>${fmt(unidades)}</strong> ${unidades === 1 ? 'unidad' : 'unidades'} en total`;

  $('lista').innerHTML = ver.length === 0
    ? '<p class="vacio">Sin resultados.</p>'
    : ver.map(f => `
        <div class="fila">
          <div class="texto">
            <div class="codigo">${f.codigo}</div>
            <div class="desc">${f.descripcion}</div>
          </div>
          <div class="cant${f.stock < 0 ? ' negativo' : ''}">${f.stock}</div>
          <div class="donde">${f.posicion ?? '—'}</div>
        </div>`).join('');
}
$('buscar').oninput = pintar;

// ---------- motivos (tabla motivos: el signo lo define la base) ----------
let motivos = [];
async function cargarMotivos(){
  const { data, error } = await db.from('motivos').select('*');
  if (error) {
    $('m-motivo').innerHTML = '<option value="">Sin motivos</option>';
    avisar('m-aviso', 'No se pudieron leer los motivos:\n' + error.message, false);
    return;
  }
  // Entradas primero, después salidas; dentro de cada grupo, alfabético.
  motivos = data.sort((a, b) => b.signo - a.signo || a.codigo.localeCompare(b.codigo));
  const nombre = c => c.charAt(0) + c.slice(1).toLowerCase().replaceAll('_', ' ');
  $('m-motivo').innerHTML = motivos
    .map(m => `<option value="${m.codigo}">${nombre(m.codigo)}</option>`)
    .join('');
  mostrarSentido();
}
function mostrarSentido(){
  const m = motivos.find(x => x.codigo === $('m-motivo').value);
  const el = $('m-sentido');
  el.className = 'sentido' + (m ? (m.signo > 0 ? ' entra' : ' sale') : '');
  el.textContent = m ? (m.signo > 0 ? '↑ Entra al stock' : '↓ Sale del stock') : '';
}
$('m-motivo').onchange = mostrarSentido;

// ---------- avisos ----------
function avisar(donde, texto, ok){
  $(donde).innerHTML = `<div class="aviso ${ok ? 'ok' : 'mal'}">${texto}</div>`;
}

// ---------- alta de movimiento ----------
$('m-fecha').value = new Date().toISOString().slice(0, 10);

$('m-guardar').onclick = async () => {
  // Cortesía: la base es la que valida de verdad.
  const cant = Number($('m-cant').value);
  if (!Number.isInteger(cant) || cant <= 0) {
    avisar('m-aviso', 'La cantidad tiene que ser un número entero mayor que cero.', false);
    return;
  }
  const b = $('m-guardar');
  b.disabled = true;
  const { error } = await db.from('movimientos').insert({
    producto: $('m-prod').value,
    fecha:    $('m-fecha').value,
    cantidad: cant,
    motivo:   $('m-motivo').value,
    nota:     $('m-nota').value || null
  });
  b.disabled = false;

  if (error) { avisar('m-aviso', 'La base lo rechazó:\n' + error.message, false); return; }
  avisar('m-aviso', 'Movimiento registrado.', true);
  $('m-cant').value = ''; $('m-nota').value = '';
  cargarStock();
};

// ---------- alta de producto ----------
// etapa: solo para SE. familia: solo para códigos con X (comodín de familia).
const tieneX = () => $('p-codigo').value.toUpperCase().includes('X');
function camposCondicionales(){
  $('p-etapa-caja').hidden   = $('p-tipo').value !== 'SE';
  $('p-familia-caja').hidden = !tieneX();
}
$('p-tipo').onchange  = camposCondicionales;
$('p-codigo').oninput = camposCondicionales;

$('p-guardar').onclick = async () => {
  const b = $('p-guardar');
  b.disabled = true;
  const { error } = await db.from('productos').insert({
    codigo:      $('p-codigo').value.trim(),
    descripcion: $('p-desc').value.trim(),
    tipo:        $('p-tipo').value,
    origen:      $('p-origen').value,
    posicion:    $('p-pos').value.trim() || null,
    etapa:       $('p-tipo').value === 'SE' ? ($('p-etapa').value.trim() || null) : null,
    familia:     tieneX()
      ? [...new Set($('p-familia').value.toUpperCase().split(/[\s,;]+/).filter(Boolean))]
      : null
  });
  b.disabled = false;

  if (error) { avisar('p-aviso', 'La base lo rechazó:\n' + error.message, false); return; }
  avisar('p-aviso', 'Producto dado de alta.', true);
  ['p-codigo','p-desc','p-pos','p-etapa','p-familia'].forEach(id => $(id).value = '');
  camposCondicionales();
  cargarStock();
};

// ---------- sesión ----------
function mostrarLogin(){
  $('app').hidden = true;
  $('p-login').hidden = false;
  permitidas = [];
  filas = [];
  $('lista').innerHTML = '';
  $('m-prod').innerHTML = '';
}

let usuarioActual = null;
async function entrarCon(user){
  if (user.id === usuarioActual) return;   // p. ej. refresco de token
  usuarioActual = user.id;

  const { data: perfil, error } = await db
    .from('perfiles').select('nombre, rol').eq('id', user.id).maybeSingle();

  $('p-login').hidden = true;
  $('app').hidden = false;
  $('s-nombre').textContent = perfil?.nombre || user.email;

  if (error || !perfil || !PERMISOS[perfil.rol]) {
    $('s-rol').textContent = error
      ? 'No se pudo leer el perfil: ' + error.message
      : !perfil ? 'Este usuario no tiene perfil cargado.'
      : 'Rol desconocido: ' + perfil.rol;
    armarPantalla(null);
    return;
  }
  $('s-rol').textContent = NOMBRE_ROL[perfil.rol];
  armarPantalla(perfil.rol);
  if (permitidas.includes('t-mov')) cargarMotivos();
}

db.auth.onAuthStateChange((_evento, sesion) => {
  // Fuera del callback: Supabase recomienda no esperar otras llamadas adentro.
  setTimeout(() => {
    if (sesion?.user) entrarCon(sesion.user);
    else { usuarioActual = null; mostrarLogin(); }
  }, 0);
});

$('l-form').onsubmit = async e => {
  e.preventDefault();
  const b = $('l-entrar');
  b.disabled = true;
  $('l-aviso').innerHTML = '';
  const { error } = await db.auth.signInWithPassword({
    email: $('l-mail').value.trim(),
    password: $('l-clave').value,
  });
  b.disabled = false;
  if (error) { avisar('l-aviso', 'No se pudo entrar:\n' + error.message, false); return; }
  $('l-clave').value = '';
};

$('s-salir').onclick = () => db.auth.signOut();
</script>
</body>
</html>
